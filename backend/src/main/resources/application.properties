server.port=8080
# Application Details
spring.application.name=genz-connectors-backend

# Hide generic error traces in production
server.error.include-stacktrace=never
server.error.include-message=always

# AWS Configuration
aws.region=${AWS_REGION:us-east-1}

# DynamoDB Tables
dynamodb.table.users=${DYNAMODB_USERS_TABLE:Users}
dynamodb.table.profiles=${DYNAMODB_PROFILES_TABLE:Profiles}
dynamodb.table.intents=${DYNAMODB_INTENTS_TABLE:Intents}
dynamodb.table.projects=${DYNAMODB_PROJECTS_TABLE:Projects}
dynamodb.table.connections=${DYNAMODB_CONNECTIONS_TABLE:Connections}
dynamodb.table.recommendations=${DYNAMODB_RECOMMENDATIONS_TABLE:Recommendations}
